[build-system]
requires = ["setuptools>=77"]  # 77: SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "lead-enrich"
version = "0.1.0"
description = "Enrich a list of company websites into a scored, sales-ready lead list (public business info only)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12,<2",
    "beautifulsoup4>=4.12,<5",
    "click>=8.1,<9",
    "protego>=0.4,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "requests>=2.32.4,<3",  # 2.32.4: netrc credential leak fix (CVE-2024-47081)
    # used directly: HTTPResponse.read1 for deadline-bounded reads. 2.6.3: decompression is
    # bounded per read and nested Content-Encoding chains are limited (CVE-2025-66471/66418),
    # which the byte cap against gzip bombs relies on.
    "urllib3>=2.6.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.0"]  # ruff pinned: CI and local must format alike

[project.scripts]
enrich = "lead_enrich.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
