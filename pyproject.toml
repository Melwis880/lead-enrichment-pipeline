[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-enrich"
version = "0.1.0"
description = "Enrich a list of company websites into a scored, sales-ready lead list (public business info only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12,<2",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
enrich = "lead_enrich.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
